[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcampus-backend"
version = "0.1.0"
description = "AgentCampus multi-agent orchestration backend"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "crewai",
    "pydantic",
    "python-dotenv",
    "groq",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app"]