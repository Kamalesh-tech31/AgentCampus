[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcampus-backend"
version = "0.1.0"
description = "AgentCampus multi-agent orchestration backend"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "crewai",
    "pydantic",
    "python-dotenv",
    "groq",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app"]
markers = [
    "critical: High-priority critical test case covering core fixes and smoke tests",
    "batch1: Batch 1 of non-critical test cases (Sections 0, A, B, C1-C5)",
    "batch2: Batch 2 of non-critical test cases (Sections C6-C15, D, E2-E6)",
    "batch3: Batch 3 of non-critical test cases (Sections E7-E15, F, G)"
]